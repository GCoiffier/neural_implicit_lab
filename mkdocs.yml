site_name: ImplicitLab

theme: 
  palette: 
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to light mode

  features:
    - navigation.instant
    #- navigation.tabs
    #- navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - toc.follow

plugins:
- search
- autorefs
# - awesome-pages
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        paths: [ImplicitLab/]
        options:
          show_root_toc_entry: false
          show_root_heading: false
          show_signature_annotations: false
          show_signature: true
          show_if_no_docstring: false
          show_source: false
          merge_init_into_class: true
          docstring_style: "google"
          docstring_section_style: table
          inherited_members: true
- mkdocs-nav-weight:
    section_renamed: false
    index_weight: -10
    warning: true
    reverse: false
    headless_included: false
- macros:
    module_name: docs/docs_macros
    render_by_default: false


markdown_extensions:
  - codehilite
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - toc:
      toc_depth: 3
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - footnotes

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


repo_url: https://github.com/GCoiffier/neural_implicit_lab
repo_name: GCoiffier/neural_implicit_lab

nav:
  - Home: "index.md"

  - Tutorials: 
  #   - "tutorial/preparing_dataset.md"
  #   - "tutorial/training_model.md"
  #   - "tutorial/geometrical_queries.md"
    - "tutorial/full_example.md"

  - Documentation:
    - implicitlab.data:
      - "documentation/geometry.md"
      - "documentation/dataset_sampling.md"
      - "documentation/field_computations.md"
    - implicitlab.nn:
      - "documentation/base_implicit_model.md"
      - "documentation/nn_architectures.md"
      - "documentation/positional_encodings.md"
    - implicitlab.training:
      - "documentation/trainer.md"
      - "documentation/callbacks.md"
      - "documentation/optimizers.md"
      - "documentation/loss_functions.md"
    - implicitlab.queries:
      - "documentation/queries.md"
      - "documentation/visualize.md"
    - "documentation/diff_op.md"
    - "documentation/utils.md"